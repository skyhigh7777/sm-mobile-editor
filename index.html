<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#12141C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="譜面エディタ">
  <meta name="description" content="外出先で Etterna / StepMania の .sm 譜面を編集する簡易エディタ">
  <title>譜面エディタ</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="row title-row">
        <h1>譜面エディタ</h1>
        <div id="stats" class="stats">譜面を開くか、新規で始めてね</div>
      </div>
      <div class="row file-row">
        <button type="button" id="btnOpenSm" class="btn">譜面</button>
        <button type="button" id="btnOpenAudio" class="btn">音源</button>
        <button type="button" id="btnNew" class="btn">新規</button>
        <button type="button" id="btnExport" class="btn primary" disabled>書き出す</button>
        <input type="file" id="fileSm" accept=".sm,text/plain,.SM" hidden>
        <input type="file" id="fileAudio" accept="audio/*,.ogg,.mp3,.wav,.flac,.ogv" hidden>
      </div>
      <div class="row chart-row">
        <label class="sel-label">難易度
          <select id="chartSelect" disabled></select>
        </label>
        <button type="button" id="btnAddDiff" class="btn" disabled>追加</button>
        <span id="fileLabel" class="file-label"></span>
      </div>
      <div class="row snap-row" id="snapRow"></div>
      <div class="row tool-row">
        <div class="seg" role="tablist">
          <button type="button" id="modeTap" class="seg-btn on">タップ</button>
          <button type="button" id="modeLn" class="seg-btn">LN</button>
        </div>
        <button type="button" id="btnUndo" class="btn icon" disabled aria-label="取り消し">↩</button>
        <button type="button" id="btnRedo" class="btn icon" disabled aria-label="やり直し">↪</button>
        <button type="button" id="btnMore" class="btn">設定</button>
      </div>
      <div class="row play-row">
        <button type="button" id="btnPlay" class="btn play" disabled aria-label="再生">▶</button>
        <label class="sel-label">速度
          <select id="speedSelect">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
          </select>
        </label>
        <label class="chk"><input type="checkbox" id="assistChk"> アシスト音</label>
        <button type="button" id="btnGoto" class="btn">小節へ</button>
      </div>
    </header>
    <div id="colHeads" class="col-heads" aria-hidden="true">
      <span class="col-num" data-col="0">1</span>
      <span class="col-num" data-col="1">2</span>
      <span class="col-num" data-col="2">3</span>
      <span class="col-num" data-col="3">4</span>
    </div>
    <div id="scroller" class="scroller">
      <div id="sizer" class="sizer"></div>
      <canvas id="grid" class="grid"></canvas>
    </div>
    <div id="toast" class="toast hidden" role="status"></div>
  </div>

  <div id="overlay" class="overlay hidden">
    <div id="dialogNew" class="dialog hidden">
      <h2>新規譜面</h2>
      <label>タイトル <input type="text" id="newTitle" value="New Chart"></label>
      <label>BPM <input type="number" id="newBpm" value="140" min="1" max="999" step="0.001"></label>
      <label>オフセット（秒） <input type="number" id="newOffset" value="0" step="0.000001"></label>
      <label>小節数 <input type="number" id="newMeasures" value="32" min="1" max="2000" step="1"></label>
      <label>クレジット <input type="text" id="newCredit" value=""></label>
      <p class="hint">タイミングの細かい調整は、家に帰ってから ArrowVortex でやってね。</p>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>やめる</button>
        <button type="button" class="btn primary" id="btnCreateNew">つくる</button>
      </div>
    </div>

    <div id="dialogAddDiff" class="dialog hidden">
      <h2>難易度を追加</h2>
      <label>難易度
        <select id="addDiffName">
          <option>Beginner</option>
          <option>Easy</option>
          <option>Medium</option>
          <option>Hard</option>
          <option selected>Challenge</option>
          <option>Edit</option>
        </select>
      </label>
      <label>レベル <input type="number" id="addDiffMeter" value="1" min="1" max="99"></label>
      <label>クレジット <input type="text" id="addDiffCredit" value=""></label>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>やめる</button>
        <button type="button" class="btn primary" id="btnCreateDiff">追加</button>
      </div>
    </div>

    <div id="dialogGoto" class="dialog hidden">
      <h2>小節へ移動</h2>
      <label>小節番号（1始まり） <input type="number" id="gotoMeasure" value="1" min="1"></label>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>やめる</button>
        <button type="button" class="btn primary" id="btnDoGoto">移動</button>
      </div>
    </div>

    <div id="dialogMore" class="dialog hidden">
      <h2>設定</h2>
      <label>拡大（1拍の高さ） <input type="range" id="zoomRange" min="40" max="160" value="80"><span id="zoomVal">80px</span></label>
      <label>レイテンシ補正 <input type="range" id="latencyRange" min="-120" max="120" value="0" step="1"><span id="latencyVal">0ms</span></label>
      <p class="hint">音が遅れて聞こえるときは、プラス方向に動かしてみて。端末によってズレ方は違うよ。</p>
      <label>小節を追加 <input type="number" id="extendCount" value="8" min="1" max="256">
        <button type="button" class="btn" id="btnExtend">追加する</button>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn" id="btnClearSession">保存を消す</button>
        <button type="button" class="btn primary" data-close>とじる</button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
